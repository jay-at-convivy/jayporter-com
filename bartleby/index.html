<!DOCTYPE html>
<html>
<head>
	  <meta charset="UTF-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  	<meta name="description" content="Your steadfast AI assistant"">
  	<meta name="keywords" content="AI, GPT, Bartleby, truculent">
  	<meta name="author" content="Jay Porter">
  	<meta property="og:title" content="BartelbyGPT">
  	<meta property="og:description" content="Your steadfast AI assistant">
  	<meta property="og:image" content="path/to/your/image.jpg">
	<title>BartlebyGPT</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #f1f1f1;
  }
  form {
    text-align: center;
    padding: 30px;
    background-color: #ffffff;
    border-radius: 8px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    max-width: 400px;
    width: 100%;
  }
  h2 {
    margin-top: 0;
    color: #333333;
    font-size: 24px;
    font-weight: 400;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-bottom: 5px;
    color: #333333;
    font-weight: 300;
    font-size: 16px;
    text-align: left;
  }
  input[type="text"] {
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #cccccc;
    width: 100%;
    background-color: #f9f9f9;
    color: #333333;
    font-size: 16px;
    font-weight: 300;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #4d90fe;
  }
  input[type="submit"] {
    background-color: #ff7f50;
    color: #ffffff;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
    transition: background-color 0.3s ease;
    font-size: 16px;
    font-weight: 400;
  }
  input[type="submit"]:hover {
    background-color: #ff6347;
  }
  .result {
    margin-top: 40px;
    font-size: 18px;
    color: #333333;
    text-align: left;
    font-weight: 300;
    max-width: 60ch;
    overflow-wrap: break-word;
  }
  .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9f9f9;
    }
    .footer-text {
      font-size: 13px;
      color: #777777;
      margin-right: 4px;
    }
    .footer-link {
		font-size: 13px;
      color: #ff7f50;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .footer-link:hover {
      color: #ff6347;
    }
</style>

  </form>
  <form action="/bartleby" method="post">
  	 <div class="form-group">
  		<input type="text" name="user_input" id="user_input" value ="" placeholder="who is the best actor on Baywatch?" oninput="this.placeholder = ''">
   	 </div>
	<input type="hidden" name="input_prompt" value="who is the best actor on Baywatch?">
  	<input type="submit" value="Ask Bartleby">
  </form>
<div class="result">
	
  </div>
  <div class="footer">
    <span class="footer-text">by</span>
    <a href="http://www.jayporter.com" class="footer-link">Jay Porter</a>
  </div>

</body>

</html>
